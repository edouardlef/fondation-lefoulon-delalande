name = "fondation-lefoulon-delalande"
main = "src/index.js"
compatibility_date = "2024-09-23"

# URL du front (pour le CORS). Surchargée en local par worker/.dev.vars.
[vars]
FRONT_URL = "https://www.fondation-lefoulon-delalande.fr"

# ── Cache KV (optionnel) ─────────────────────────────────────────────────────
# Le Worker fonctionne sans KV (il interroge Notion à chaque requête).
# Pour activer le cache de 1 h :
#   1) npx wrangler kv namespace create fondation-kv
#   2) décommenter le bloc ci-dessous et coller l'id retourné
#   3) commit + push
# [[kv_namespaces]]
# binding = "KV"
# id = "REMPLACER_PAR_VRAI_ID"
